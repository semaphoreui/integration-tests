name: Configuration matrix

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      include_schedule_investigation:
        description: Include the known-failing schedule execution reproducer
        required: false
        type: boolean
        default: false
      include_shell_output_investigation:
        description: Include the known-failing shell output reproducer
        required: false
        type: boolean
        default: false
      application_branch:
        description: >-
          Application branch to test; defaults to develop
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: configuration-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One build for the whole matrix: every profile then pulls the very same application image,
  # so a failure of one profile cannot be blamed on a different commit of the application.
  app-image:
    name: Application source
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_prepare-app-image.yml
    with:
      application_branch: ${{ inputs.application_branch || '' }}
    secrets:
      application_repository_token: ${{ secrets.APPLICATION_REPOSITORY_TOKEN }}

  profile:
    name: ${{ matrix.profile }}
    needs: app-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        profile:
          - core-postgres-local
          - core-mysql-local
          - core-mariadb-local
          - prod-postgres-runner
          - feature-ssh-local
          - feature-git-https
          - feature-oidc-local
          - feature-proxy-oidc
          - feature-ldap-tls
          - feature-totp-local
          - feature-encryption-rotation
        include: ${{ fromJSON(inputs.include_schedule_investigation && inputs.include_shell_output_investigation && '[{"profile":"feature-schedule-timezone"},{"profile":"feature-shell-output"}]' || inputs.include_schedule_investigation && '[{"profile":"feature-schedule-timezone"}]' || inputs.include_shell_output_investigation && '[{"profile":"feature-shell-output"}]' || '[]') }}
    env:
      PROFILE: ${{ matrix.profile }}
      APP_SOURCE: ${{ needs.app-image.outputs.app_source }}
      APP_IMAGE: ${{ needs.app-image.outputs.app_image }}
      APP_REPOSITORY: ${{ needs.app-image.outputs.app_repository }}
      APP_BRANCH: ${{ needs.app-image.outputs.app_branch }}
      APP_SHA: ${{ needs.app-image.outputs.app_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to the temporary image registry
        if: needs.app-image.outputs.app_source != 'docker-image'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Playwright Chromium
        if: matrix.profile == 'feature-oidc-local' || matrix.profile == 'feature-proxy-oidc' || matrix.profile == 'feature-totp-local'
        run: |
          # Playwright installs Ubuntu packages with apt. The hosted runner also enables an
          # unrelated Google Chrome repository whose temporarily inconsistent index can make
          # that apt update fail before any project test starts.
          for source in /etc/apt/sources.list.d/*; do
            if grep -q 'dl.google.com/linux/chrome-stable' "$source"; then
              sudo mv "$source" "$RUNNER_TEMP/$(basename "$source").disabled"
            fi
          done
          ./gradlew --no-daemon playwrightInstallChromium

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Start profile
        if: matrix.profile != 'feature-encryption-rotation'
        run: test-environment/profile up "$PROFILE"

      - name: Run profile suite
        if: matrix.profile != 'feature-encryption-rotation'
        run: test-environment/profile test "$PROFILE" --no-daemon

      - name: Run encryption rotation lifecycle
        if: matrix.profile == 'feature-encryption-rotation'
        run: test-environment/profile encryption-rotation-test "$PROFILE"

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p build/ci-diagnostics
          test-environment/profile ps "$PROFILE" > "build/ci-diagnostics/$PROFILE-ps.txt" 2>&1 || true
          test-environment/profile logs "$PROFILE" > "build/ci-diagnostics/$PROFILE-compose.log" 2>&1 || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/apiTest/
            build/test-results/apiTest/
            build/reports/tests/uiTest/
            build/test-results/uiTest/
            build/reports/tests/totpTest/
            build/test-results/totpTest/
            build/reports/tests/encryptionRotationTest/
            build/test-results/encryptionRotationTest/
            build/ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload profile Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.profile }}
          path: build/allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean profile
        if: always()
        run: test-environment/profile clean "$PROFILE" --yes

  allure-report:
    name: Build Allure report
    if: ${{ always() }}
    needs:
      - app-image
      - profile
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_publish-allure.yml
    with:
      report_title: Semaphore configuration matrix

name: Configuration matrix

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      include_schedule_investigation:
        description: Include the known-failing schedule execution reproducer
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: configuration-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.include_schedule_investigation && '["core-postgres-local","core-mysql-local","core-mariadb-local","prod-postgres-runner","feature-ssh-local","feature-oidc-local","feature-ldap-tls","feature-schedule-timezone"]' || '["core-postgres-local","core-mysql-local","core-mariadb-local","prod-postgres-runner","feature-ssh-local","feature-oidc-local","feature-ldap-tls"]') }}
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Playwright Chromium
        if: matrix.profile == 'feature-oidc-local'
        run: ./gradlew --no-daemon playwrightInstallChromium

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Start profile
        run: test-environment/profile up "$PROFILE"

      - name: Run profile suite
        run: test-environment/profile test "$PROFILE" --no-daemon

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p build/ci-diagnostics
          test-environment/profile ps "$PROFILE" > "build/ci-diagnostics/$PROFILE-ps.txt" 2>&1 || true
          test-environment/profile logs "$PROFILE" > "build/ci-diagnostics/$PROFILE-compose.log" 2>&1 || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/apiTest/
            build/test-results/apiTest/
            build/reports/tests/uiTest/
            build/test-results/uiTest/
            build/ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload profile Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.profile }}
          path: build/allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean profile
        if: always()
        run: test-environment/profile clean "$PROFILE" --yes

  allure-report:
    name: Build Allure report
    if: ${{ always() }}
    needs: profile
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_publish-allure.yml
    with:
      report_title: Semaphore configuration matrix

name: Release upgrade

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:
    inputs:
      application_branch:
        description: >-
          Application branch to upgrade to; defaults to develop
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The version being upgraded to is built once, so all four database profiles verify the same
  # application commit.
  app-image:
    name: Application source
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_prepare-app-image.yml
    with:
      application_branch: ${{ inputs.application_branch || '' }}
    secrets:
      application_repository_token: ${{ secrets.APPLICATION_REPOSITORY_TOKEN }}

  upgrade:
    name: ${{ matrix.profile }}
    needs: app-image
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        profile:
          - upgrade-sqlite-local
          - upgrade-postgres-local
          - upgrade-mysql-local
          - upgrade-mariadb-local
    env:
      PROFILE: ${{ matrix.profile }}
      APP_SOURCE: ${{ needs.app-image.outputs.app_source }}
      APP_IMAGE: ${{ needs.app-image.outputs.app_image }}
      APP_REPOSITORY: ${{ needs.app-image.outputs.app_repository }}
      APP_BRANCH: ${{ needs.app-image.outputs.app_branch }}
      APP_SHA: ${{ needs.app-image.outputs.app_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to the temporary image registry
        if: needs.app-image.outputs.app_source != 'docker-image'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run N-1 to current upgrade
        run: test-environment/profile upgrade-test "$PROFILE"

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p build/ci-diagnostics
          test-environment/profile ps "$PROFILE" > "build/ci-diagnostics/$PROFILE-ps.txt" 2>&1 || true
          test-environment/profile logs "$PROFILE" > "build/ci-diagnostics/$PROFILE-compose.log" 2>&1 || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/upgradeTest/
            build/test-results/upgradeTest/
            build/reports/tests/apiTest/
            build/test-results/apiTest/
            build/ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload profile Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.profile }}
          path: build/allure-results/
          if-no-files-found: ignore
          retention-days: 21

      - name: Clean profile
        if: always()
        run: test-environment/profile clean "$PROFILE" --yes

  allure-report:
    name: Build Allure report
    if: ${{ always() }}
    needs:
      - app-image
      - upgrade
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_publish-allure.yml
    with:
      report_title: Semaphore release upgrade

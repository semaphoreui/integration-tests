name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      application_repository:
        description: Application repository as owner/name; overrides the pull request description
        required: false
        type: string
        default: ""
      application_pull_request:
        description: Application pull request number; overrides the pull request description
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.application_pull_request || 'default' }}
  cancel-in-progress: true

jobs:
  app-image:
    name: Application source
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_prepare-app-image.yml
    with:
      application_repository: ${{ inputs.application_repository || '' }}
      application_pull_request: ${{ inputs.application_pull_request || '' }}
      # Empty for a push to main, a scheduled run or a manual run, so those keep behaving
      # exactly as before.
      pull_request_body: ${{ github.event.pull_request.body }}
    secrets:
      application_repository_token: ${{ secrets.APPLICATION_REPOSITORY_TOKEN }}

  quality:
    name: Framework quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run quality gate
        run: ./gradlew --no-daemon qualityGate

      - name: Test Pages archive generator
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/jacoco/
            build/reports/tests/frameworkTest/
            build/test-results/frameworkTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload quality Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-quality
          path: build/allure-results/
          if-no-files-found: ignore
          retention-days: 14

  core-sqlite:
    name: Core API + UI · SQLite
    needs:
      - quality
      - app-image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    env:
      PROFILE: core-sqlite-local
      APP_IMAGE: ${{ needs.app-image.outputs.app_image }}
      APP_REPOSITORY: ${{ needs.app-image.outputs.app_repository }}
      APP_PR: ${{ needs.app-image.outputs.app_pr }}
      APP_SHA: ${{ needs.app-image.outputs.app_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to the temporary image registry
        if: needs.app-image.outputs.app_source == 'pull-request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Playwright Chromium
        run: ./gradlew --no-daemon playwrightInstallChromium

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Start profile
        run: test-environment/profile up "$PROFILE"

      - name: Run core API suite
        run: test-environment/profile test "$PROFILE" --no-daemon

      - name: Run core UI smoke
        run: >-
          ./gradlew --no-daemon uiTest
          -DSTAND=semaphore
          -DSEMAPHORE_PROFILE="$PROFILE"

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p build/ci-diagnostics
          test-environment/profile ps "$PROFILE" > "build/ci-diagnostics/$PROFILE-ps.txt" 2>&1 || true
          test-environment/profile logs "$PROFILE" > "build/ci-diagnostics/$PROFILE-compose.log" 2>&1 || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROFILE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/apiTest/
            build/test-results/apiTest/
            build/reports/tests/uiTest/
            build/test-results/uiTest/
            build/ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload profile Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ env.PROFILE }}
          path: build/allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean profile
        if: always()
        run: test-environment/profile clean "$PROFILE" --yes

  allure-report:
    name: Build Allure report
    if: ${{ always() }}
    needs:
      - app-image
      - quality
      - core-sqlite
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_publish-allure.yml
    with:
      report_title: Semaphore CI

name: Build downloadable Allure report

on:
  workflow_call:
    inputs:
      report_title:
        description: Title shown on the Allure Pages landing page
        required: true
        type: string

jobs:
  build:
    name: Build Allure HTML artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download Allure result artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: allure-results-*
          path: downloaded-allure

      - name: Download pinned Allure CLI
        run: ./gradlew --no-daemon downloadAllure

      - name: Build Pages site
        env:
          REPORT_TITLE: ${{ inputs.report_title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/build-allure-pages.sh downloaded-allure "$REPORT_TITLE" "$RUN_URL"

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v7
        with:
          name: allure-html-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pages-site
          if-no-files-found: error
          retention-days: 21

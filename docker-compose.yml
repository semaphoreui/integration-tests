services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: semaphore-test-api:latest
    container_name: semaphore-test-api

    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      
    environment:
      # GRADLE_OPTS: ${GRADLE_OPTS:-Xmx2g}
      PROJECT_DIR: ${PROJECT_DIR:-/workspace}
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:3000/api/}
      API_USERNAME: ${API_USERNAME:-admin}
      API_PASSWORD: ${API_PASSOWRD:-admin}
    ports:
      - "8080:8080"  

    stdin_open: true
    tty: true

    restart: unless-stopped

volumes:
  gradle-cache:
  maven-cache:


# Внешний экземпляр Semaphore - конфигурируется через переменные окружения или системные свойства
# Примеры использования:
#   ./gradlew apiTest -DSTAND=external -Dapi.base.url=http://your-host:3000/api/
#   api.base.url=http://your-host:3000/api/ ./gradlew apiTest -DSTAND=external
#   API_BASE_URL=http://your-host:3000/api/ ./gradlew apiTest -DSTAND=external

# Все свойства должны переопределяться во время запуска. По умолчанию указаны значения для локального Semaphore.
api.base.url=http://localhost:3000/api/
api.username=admin
api.password=admin

ui.base.url=http://localhost:3000
ui.user=admin
ui.password=admin
ui.headless=true
teardown.failOnError=true

events {}

http {
  server {
    listen 443 ssl;
    server_name git-https-fixture;

    ssl_certificate /run/git-https/server-cert.pem;
    ssl_certificate_key /run/git-https/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /health {
      access_log off;
      auth_basic off;
      default_type text/plain;
      return 200 "ok";
    }

    location /ansible.git/ {
      auth_basic "Bookwright private Git fixture";
      auth_basic_user_file /etc/nginx/.htpasswd;
      root /srv/git;
    }
  }
}

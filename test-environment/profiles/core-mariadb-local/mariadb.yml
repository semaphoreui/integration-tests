services:
  semaphore:
    environment:
      SEMAPHORE_DB_DIALECT: mysql
      SEMAPHORE_DB_HOST: mariadb
      SEMAPHORE_DB_PORT: "3306"
      SEMAPHORE_DB_USER: semaphore
      SEMAPHORE_DB_PASS: test-password
      SEMAPHORE_DB: semaphore
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root-test-password
      MARIADB_USER: semaphore
      MARIADB_PASSWORD: test-password
      MARIADB_DATABASE: semaphore
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data:

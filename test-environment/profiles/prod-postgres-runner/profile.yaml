id: prod-postgres-runner
description: Develop branch server with PostgreSQL and a separate persistent remote runner
compose_file: compose.yml
compose_project: semaphore-test-prod-postgres-runner
readiness_url: http://localhost:3000/api/ping
stand: semaphore
setup_service: runner-configure
semaphore_version: develop
semaphore_image: branch:develop
edition: community
installation: docker-compose
architecture: native
database_type: postgres
database_image: postgres:14.3
execution_mode: remote-runner
execution_executor: local
runner_image: semaphoreui/runner:v2.19.12
runner_name: bookwright-persistent-runner
auth: password
git_client: cmd_git
capabilities: core-api,task-execution,task-stop,git-local,rbac,schedules,secrets,database-migrations,remote-runner

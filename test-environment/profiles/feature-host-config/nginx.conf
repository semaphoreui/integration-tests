events {}

http {
  # Dumb HTTP transport: every repository carries update-server-info output, so static files are
  # enough for clone and fetch.
  server {
    listen 80;
    server_name host-config-git;

    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    location /public/ {
      root /srv/git;
    }

    location / {
      return 404;
    }
  }

  server {
    listen 443 ssl;
    server_name host-config-git;

    ssl_certificate /run/host-config-git/server-cert.pem;
    ssl_certificate_key /run/host-config-git/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /private/ {
      auth_basic "Bookwright private Git fixture";
      auth_basic_user_file /etc/nginx/.htpasswd;
      root /srv/git;
    }

    location / {
      return 404;
    }
  }
}

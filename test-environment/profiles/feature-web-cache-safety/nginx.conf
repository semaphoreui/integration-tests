events {}

http {
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=semaphore_shared:10m
                   max_size=64m inactive=10m use_temp_path=off;

  upstream semaphore_backend {
    server semaphore:3000;
  }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://semaphore_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Original-URL $http_x_original_url;
      proxy_set_header X-Rewrite-URL $http_x_rewrite_url;

      proxy_cache semaphore_shared;
      proxy_cache_methods GET HEAD;
      proxy_cache_key "$scheme|$request_method|$host|$uri|$http_x_bookwright_probe";
      proxy_cache_valid 200 302 10m;
      proxy_cache_valid 404 1m;
      add_header X-Bookwright-Cache-Status $upstream_cache_status always;

      proxy_connect_timeout 3s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}

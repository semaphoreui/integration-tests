services:
  fixture-init:
    image: semaphoreui/semaphore:v2.19.12
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cp -R /source/. /repository/
        chown -R 0:0 /repository
        git -C /repository init -b main
        git -C /repository config user.name "Semaphore Test Fixture"
        git -C /repository config user.email "fixture@localhost"
        git -C /repository add .
        git -C /repository diff --cached --quiet || git -C /repository commit -m "Prepare safe smoke fixture"
        git -C /repository branch -f bookwright-fixture-ref HEAD
        git -C /repository checkout -B bookwright-branch-isolation-a main
        cp /source/test-environment/fixtures/ansible/branch-isolation-a.yml /repository/test-environment/fixtures/ansible/branch-isolation.yml
        printf '%s\n' branch-a > /repository/test-environment/fixtures/ansible/.bookwright-branch-marker
        git -C /repository add test-environment/fixtures/ansible/branch-isolation.yml test-environment/fixtures/ansible/.bookwright-branch-marker
        git -C /repository commit -m "Add branch isolation fixture A"
        git -C /repository checkout main
        git -C /repository checkout -B bookwright-branch-isolation-b main
        cp /source/test-environment/fixtures/ansible/branch-isolation-b.yml /repository/test-environment/fixtures/ansible/branch-isolation.yml
        printf '%s\n' branch-b > /repository/test-environment/fixtures/ansible/.bookwright-branch-marker
        git -C /repository add test-environment/fixtures/ansible/branch-isolation.yml test-environment/fixtures/ansible/.bookwright-branch-marker
        git -C /repository commit -m "Add branch isolation fixture B"
        git -C /repository checkout main
        chown -R 1001:0 /repository
    volumes:
      - fixture-repository:/repository
      - ./fixtures:/source/test-environment/fixtures:ro

  semaphore:
    image: ${SEMAPHORE_IMAGE:-semaphoreui/semaphore:v2.19.12}
    ports:
      - "3000:3000"
    environment:
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: test-password
      SEMAPHORE_ADMIN_NAME: Test Admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: IlRqgrrO5Gp27MlWakDX1xVrPv4jhoUx+ARY+qGyDxQ=
    volumes:
      - fixture-repository:/repository:ro
    restart: unless-stopped
    depends_on:
      fixture-init:
        condition: service_completed_successfully

volumes:
  fixture-repository:

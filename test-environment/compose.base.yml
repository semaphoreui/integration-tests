services:
  fixture-init:
    image: semaphoreui/semaphore:v2.19.7
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        find /repository -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        cp -R -T /source /repository
        chown -R 0:0 /repository
        cd /repository
        git init -b main
        git config user.name "Semaphore Test Fixture"
        git config user.email "fixture@localhost"
        git add --all
        git commit -m "Prepare safe smoke fixture"
        git branch bookwright-fixture-ref
        chown -R 1001:0 /repository
    volumes:
      - ./fixtures:/source/test-environment/fixtures:ro
      - repository:/repository

  semaphore:
    image: ${SEMAPHORE_IMAGE:-semaphoreui/semaphore:v2.19.7}
    ports:
      - "3000:3000"
    environment:
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: test-password
      SEMAPHORE_ADMIN_NAME: Test Admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: IlRqgrrO5Gp27MlWakDX1xVrPv4jhoUx+ARY+qGyDxQ=
    volumes:
      - repository:/repository:ro
    restart: unless-stopped
    depends_on:
      fixture-init:
        condition: service_completed_successfully

volumes:
  repository:

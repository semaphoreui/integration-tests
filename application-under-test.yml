# Explicit link between this test repository and a pull request of the application repository.
#
# By default the block below stays commented out. The pipeline then runs in normal mode: the
# application repository is not cloned, nothing is built and the Docker image declared by the
# profile manifest (test-environment/profiles/<profile>/profile.yaml) is used as before.
#
# To run the tests of a test pull request against the application built from a specific
# application pull request, uncomment the block and set the pull request number. CI resolves the
# HEAD commit of that pull request, reuses the matching temporary image when it already exists,
# and otherwise builds and pushes it.
#
#   application:
#     repository: semaphoreui/semaphore
#     pull_request: 123
#
# repository is optional and defaults to semaphoreui/semaphore.
#
# Comment the block out again before merging the test pull request, so that the default branch
# keeps this file in its neutral state. Forgetting to do so is not dangerous: a run that is not
# a test pull request ignores this file completely, and a closed or merged application pull
# request falls back to normal mode. CI reminds you about it in the run summary.
#
# The same link can be provided as CI inputs instead of this file (APP_REPOSITORY / APP_PR, or
# the inputs of the "CI" workflow_dispatch). CI inputs take precedence over this file.
#
# See docs/application-pr-testing.md for the full workflow.
